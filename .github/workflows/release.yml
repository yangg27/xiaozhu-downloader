name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build main app
        run: python _t/build_app.py

      - name: Build installer
        run: python _t/build_setup.py

      - name: Find installer
        id: find_installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist_setup" -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Installer exe not found"
            exit 1
          }
          $sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          Write-Output "installer=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          Write-Output "sha256=$sha256" >> $env:GITHUB_OUTPUT
          Write-Output "Installer: $($exe.FullName)"
          Write-Output "SHA256: $sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_installer.outputs.installer }}
          name: 小助下载器 ${{ github.ref_name }} — aria2c 备用极速通道
          body: |
            ## 下载
            - **Windows 安装包**：`${{ steps.find_installer.outputs.name }}`
            - SHA256：`${{ steps.find_installer.outputs.sha256 }}`
            - 安装后无需单独安装 aria2c，双击即用。

            ## 说明
            详见 [README.md](./README.md) 与 [使用说明.md](./使用说明.md)。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
