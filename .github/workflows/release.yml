name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1 pillow

      - name: Check environment
        run: |
          python --version
          python -c "import sys; print('executable:', sys.executable)"
          python -c "import tkinter; print('tkinter OK:', tkinter.Tcl().eval('info patchlevel'))"
          python -c "import PIL; print('PIL OK:', PIL.__version__)"

      - name: Build main app
        id: build_app
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          chcp 65001
          python _t/build_app.py

      - name: Build installer
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          chcp 65001
          python _t/build_setup.py

      - name: Find installer
        id: find_installer
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          chcp 65001
          $exe = Get-ChildItem -Path "dist_setup" -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Installer exe not found"
            exit 1
          }
          # one-file 模式：验证 exe 不依赖 _internal 目录
          $exeDir = $exe.Directory.FullName
          $internalDir = Join-Path $exeDir "_internal"
          if (Test-Path $internalDir) {
            Write-Error "one-file build should NOT have _internal directory"
            exit 1
          }
          $tag = "${{ github.ref_name }}"
          $newName = "xiaozhu-downloader-$tag-setup.exe"
          $newPath = Join-Path "dist_setup" $newName
          Copy-Item $exe.FullName $newPath -Force
          $sha256 = (Get-FileHash $newPath -Algorithm SHA256).Hash
          Write-Output "installer=$newPath" >> $env:GITHUB_OUTPUT
          Write-Output "name=$newName" >> $env:GITHUB_OUTPUT
          Write-Output "sha256=$sha256" >> $env:GITHUB_OUTPUT
          Write-Output "Installer: $newPath"
          Write-Output "SHA256: $sha256"

      - name: Clean stale release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $keep = "xiaozhu-downloader-$tag-setup.exe"
          $assets = gh release view $tag --json assets -q '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0) {
            foreach ($asset in $assets) {
              if ($asset -ne $keep) {
                Write-Output "Deleting stale asset: $asset"
                gh release delete-asset $tag $asset --yes
              }
            }
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_installer.outputs.installer }}
          name: 小助下载器 ${{ github.ref_name }} — aria2c 备用极速通道
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $body = @"
          ## 下载
          - **Windows 安装包**：`xiaozhu-downloader-$tag-setup.exe`
          - SHA256：`${{ steps.find_installer.outputs.sha256 }}`
          - 安装后无需单独安装 aria2c，双击即用。

          ## 说明
          详见 [README.md](./README.md) 与 [使用说明.md](./使用说明.md)。
          "@
          $body | Out-File -FilePath "release_notes.md" -Encoding utf8
          gh release edit $tag --notes-file "release_notes.md"
