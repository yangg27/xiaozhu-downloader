name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1 pillow

      - name: Check environment
        run: |
          python --version
          python -c "import sys; print('executable:', sys.executable)"
          python -c "import tkinter; print('tkinter OK:', tkinter.Tcl().eval('info patchlevel'))"
          python -c "import PIL; print('PIL OK:', PIL.__version__)"

      - name: Verify version alignment
        run: python _t/check_version.py

      - name: Run unit tests
        run: python -m unittest tests.test_dlcore -v

      - name: Run e2e regression
        run: python tests/e2e_regression.py

      - name: Build main app
        id: build_app
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          chcp 65001
          python _t/build_app.py

      - name: Build installer
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          chcp 65001
          python _t/build_setup.py

      - name: Build portable zip
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          chcp 65001
          $tag = "${{ github.ref_name }}"
          $zipName = "xiaozhu-downloader-$tag-portable.zip"
          $zipPath = Join-Path "dist_setup" $zipName
          $srcDir = "dist_app\小助下载器"
          Compress-Archive -Path "$srcDir\*" -DestinationPath $zipPath -Force
          $size = [math]::Round((Get-Item $zipPath).Length/1MB, 1)
          Write-Output "Portable: $zipPath ($size MB)"

      - name: Find installer
        id: find_installer
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          chcp 65001
          $exe = Get-ChildItem -Path "dist_setup" -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Installer exe not found"
            exit 1
          }
          # one-file 模式：验证 exe 不依赖 _internal 目录
          $exeDir = $exe.Directory.FullName
          $internalDir = Join-Path $exeDir "_internal"
          if (Test-Path $internalDir) {
            Write-Error "one-file build should NOT have _internal directory"
            exit 1
          }
          $tag = "${{ github.ref_name }}"
          $newName = "xiaozhu-downloader-$tag-setup.exe"
          $newPath = Join-Path "dist_setup" $newName
          Copy-Item $exe.FullName $newPath -Force
          $sha256 = (Get-FileHash $newPath -Algorithm SHA256).Hash
          Write-Output "installer=$newPath" >> $env:GITHUB_OUTPUT
          Write-Output "name=$newName" >> $env:GITHUB_OUTPUT
          Write-Output "sha256=$sha256" >> $env:GITHUB_OUTPUT
          Write-Output "Installer: $newPath"
          Write-Output "SHA256: $sha256"

      - name: Clean stale release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        continue-on-error: true
        run: |
          $tag = "${{ github.ref_name }}"
          $keep = @("xiaozhu-downloader-$tag-setup.exe", "xiaozhu-downloader-$tag-portable.zip")
          try {
            $json = gh release view $tag --json assets 2>$null
            if ($LASTEXITCODE -eq 0 -and $json) {
              $assets = ($json | ConvertFrom-Json).assets | ForEach-Object { $_.name }
              foreach ($asset in $assets) {
                if ($asset -notin $keep) {
                  Write-Output "Deleting stale asset: $asset"
                  gh release delete-asset $tag $asset --yes
                }
              }
            } else {
              Write-Output "No existing release for $tag, skip cleanup"
            }
          } catch {
            Write-Output "Cleanup failed (non-fatal): $_"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find_installer.outputs.installer }}
            dist_setup/xiaozhu-downloader-${{ github.ref_name }}-portable.zip
          name: 小助下载器 ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $setupSha = "${{ steps.find_installer.outputs.sha256 }}"
          $zipPath = "dist_setup/xiaozhu-downloader-$tag-portable.zip"
          $zipSha = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          $zipSize = [math]::Round((Get-Item $zipPath).Length/1MB, 1)
          $body = @"
          ## 下载

          | 版本 | 文件 | 大小 | 说明 |
          |---|---|---|---|
          | **安装包** | `xiaozhu-downloader-$tag-setup.exe` | ~38 MB | 双击安装，自包含，无需 Python |
          | **便携版** | `xiaozhu-downloader-$tag-portable.zip` | ~$zipSize MB | 解压即用，启动更快，适合常驻/自启 |

          ## 校验
          - 安装包 SHA256：`$setupSha`
          - 便携版 SHA256：`$zipSha`

          ## 说明
          - 安装包：one-file 单文件，内含全部依赖（Python 运行时 + aria2c + ffmpeg）
          - 便携版：one-dir 结构，解压后运行 `小助下载器.exe`，启动速度更快
          - 浏览器扩展位于安装目录下的 browser-extension 文件夹，解压 .crx/.zip 后手动加载即可
          - 任务记录、配置和历史默认保留在 `%APPDATA%\小助下载器`，卸载/重装不会丢失

          详见 [README.md](./README.md) 与 [使用说明.md](./使用说明.md)。
          "@
          $body | Out-File -FilePath "release_notes.md" -Encoding utf8
          gh release edit $tag --notes-file "release_notes.md"
