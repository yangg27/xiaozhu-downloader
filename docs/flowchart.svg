<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1280" width="100%" role="img">
  <title>小助下载器 XZDM 全流程分场景图</title>
  <desc>展示安装、启动、浏览器接管、剪贴板监控、新建下载、下载执行、完成/错误、卸载各阶段系统后台行为。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, "Microsoft YaHei UI", sans-serif); font-size: 13px; fill: #1f2329; }
      .th { font-family: var(--font-sans, "Microsoft YaHei UI", sans-serif); font-size: 14px; font-weight: 500; fill: #1f2329; }
      .ts { font-family: var(--font-sans, "Microsoft YaHei UI", sans-serif); font-size: 12px; fill: #5f5e5a; }
      .box { fill: #f1efe8; stroke: #888780; stroke-width: 0.5; }
      .boxb { fill: #e6f1fb; stroke: #378add; stroke-width: 0.5; }
      .boxg { fill: #eaf3de; stroke: #639922; stroke-width: 0.5; }
      .boxa { fill: #faeeda; stroke: #ba7517; stroke-width: 0.5; }
      .boxr { fill: #fcebeb; stroke: #e24b4a; stroke-width: 0.5; }
      .stage { fill: #f1efe8; stroke: #5f5e5a; stroke-width: 0.5; }
      .line { fill: none; stroke: #888780; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- 场景：安装 -->
  <rect x="30" y="20" width="620" height="150" rx="12" class="stage"/>
  <text class="th" x="40" y="45">场景 1：安装</text>
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="130" height="56" rx="8" class="boxb"/>
    <text class="th" x="65" y="20" text-anchor="middle">双击安装包</text>
    <text class="ts" x="65" y="38" text-anchor="middle">one-file 自解压</text>
    <rect x="160" y="0" width="130" height="56" rx="8" class="boxb"/>
    <text class="th" x="225" y="20" text-anchor="middle">解压到</text>
    <text class="ts" x="225" y="38" text-anchor="middle">C:\Program Files\XZDM</text>
    <rect x="320" y="0" width="130" height="56" rx="8" class="boxb"/>
    <text class="th" x="385" y="20" text-anchor="middle">写注册表</text>
    <text class="ts" x="385" y="38" text-anchor="middle">自启/协议/卸载项</text>
    <rect x="480" y="0" width="130" height="56" rx="8" class="boxb"/>
    <text class="th" x="545" y="20" text-anchor="middle">创建快捷方式</text>
    <text class="ts" x="545" y="38" text-anchor="middle">开始菜单/桌面</text>
    <path d="M130 28 H160" class="line"/>
    <path d="M290 28 H320" class="line"/>
    <path d="M450 28 H480" class="line"/>
  </g>
  <text class="ts" x="50" y="145">后台行为：Payload base64 解码 → 探测 C:\Program Files\XZDM 可写性（不可写降级到 C:\XZDM）→ HKCU 注册表 → 静默启动主程序</text>

  <!-- 场景：启动 -->
  <rect x="30" y="190" width="620" height="150" rx="12" class="stage"/>
  <text class="th" x="40" y="215">场景 2：启动</text>
  <g transform="translate(50, 230)">
    <rect x="0" y="0" width="120" height="56" rx="8" class="box"/>
    <text class="th" x="60" y="20" text-anchor="middle">运行小助下载器</text>
    <text class="ts" x="60" y="38" text-anchor="middle">exe 或 --silent</text>
    <rect x="160" y="0" width="120" height="56" rx="8" class="box"/>
    <text class="th" x="220" y="20" text-anchor="middle">单实例探测</text>
    <text class="ts" x="220" y="38" text-anchor="middle">GetTcpTable / 端口</text>
    <rect x="320" y="0" width="120" height="56" rx="8" class="box"/>
    <text class="th" x="380" y="20" text-anchor="middle">加载配置/任务</text>
    <text class="ts" x="380" y="38" text-anchor="middle">config.json / jobs.json</text>
    <rect x="480" y="0" width="120" height="56" rx="8" class="box"/>
    <text class="th" x="540" y="20" text-anchor="middle">启动本地 API</text>
    <text class="ts" x="540" y="38" text-anchor="middle">127.0.0.1:8763</text>
    <path d="M120 28 H160" class="line"/>
    <path d="M280 28 H320" class="line"/>
    <path d="M440 28 H480" class="line"/>
  </g>
  <text class="ts" x="50" y="315">后台行为：handoff 已有实例 → 读配置 → 恢复未完成任务 → 起 localserver + 随机令牌</text>

  <!-- 场景：浏览器接管 -->
  <rect x="30" y="360" width="620" height="150" rx="12" class="stage"/>
  <text class="th" x="40" y="385">场景 3：浏览器接管下载</text>
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="120" height="56" rx="8" class="boxa"/>
    <text class="th" x="60" y="20" text-anchor="middle">点击下载链接</text>
    <text class="ts" x="60" y="38" text-anchor="middle">扩展拦截</text>
    <rect x="160" y="0" width="120" height="56" rx="8" class="boxa"/>
    <text class="th" x="220" y="20" text-anchor="middle">探测本地 API</text>
    <text class="ts" x="220" y="38" text-anchor="middle">8763~8774</text>
    <rect x="320" y="0" width="120" height="56" rx="8" class="boxa"/>
    <text class="th" x="380" y="20" text-anchor="middle">已运行？</text>
    <text class="ts" x="380" y="38" text-anchor="middle">HTTP /add 转交</text>
    <rect x="480" y="0" width="120" height="56" rx="8" class="boxa"/>
    <text class="th" x="540" y="20" text-anchor="middle">未运行</text>
    <text class="ts" x="540" y="38" text-anchor="middle">xzd://show 唤起</text>
    <path d="M120 28 H160" class="line"/>
    <path d="M280 28 H320" class="line"/>
    <path d="M440 28 H480" class="line"/>
  </g>
  <text class="ts" x="50" y="485">后台行为：扩展取消浏览器下载 → 127.0.0.1 /add POST → 新任务进入队列</text>

  <!-- 场景：剪贴板监控 -->
  <rect x="30" y="530" width="620" height="130" rx="12" class="stage"/>
  <text class="th" x="40" y="555">场景 4：剪贴板监控（v3.0.8 起零轮询）</text>
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="120" height="56" rx="8" class="boxg"/>
    <text class="th" x="60" y="20" text-anchor="middle">复制链接</text>
    <text class="ts" x="60" y="38" text-anchor="middle">Windows 原生事件</text>
    <rect x="160" y="0" width="120" height="56" rx="8" class="boxg"/>
    <text class="th" x="220" y="20" text-anchor="middle">主线程读取</text>
    <text class="ts" x="220" y="38" text-anchor="middle">AddClipboardFormatListener</text>
    <rect x="320" y="0" width="120" height="56" rx="8" class="boxg"/>
    <text class="th" x="380" y="20" text-anchor="middle">下载链识别</text>
    <text class="ts" x="380" y="38" text-anchor="middle">过滤普通网址</text>
    <rect x="480" y="0" width="120" height="56" rx="8" class="boxg"/>
    <text class="th" x="540" y="20" text-anchor="middle">弹新建下载</text>
    <text class="ts" x="540" y="38" text-anchor="middle">去重 / 取消后再触发</text>
    <path d="M120 28 H160" class="line"/>
    <path d="M280 28 H320" class="line"/>
    <path d="M440 28 H480" class="line"/>
  </g>
  <text class="ts" x="50" y="645">后台行为：WM_CLIPBOARDUPDATE 事件 → 主线程 clipboard_get → 仅含文件扩展名/媒体资源才唤起 → 过滤重复任务</text>

  <!-- 场景：下载执行 -->
  <rect x="30" y="680" width="620" height="160" rx="12" class="stage"/>
  <text class="th" x="40" y="705">场景 5：下载执行（v3.1.x 动态速度均衡）</text>
  <g transform="translate(50, 720)">
    <rect x="0" y="0" width="110" height="56" rx="8" class="box"/>
    <text class="th" x="55" y="20" text-anchor="middle">任务入队</text>
    <text class="ts" x="55" y="38" text-anchor="middle">并发槽最多 3</text>
    <rect x="140" y="0" width="110" height="56" rx="8" class="box"/>
    <text class="th" x="195" y="20" text-anchor="middle">速度均衡</text>
    <text class="ts" x="195" y="38" text-anchor="middle">24→19→15</text>
    <rect x="280" y="0" width="110" height="56" rx="8" class="box"/>
    <text class="th" x="335" y="20" text-anchor="middle">分块下载</text>
    <text class="ts" x="335" y="38" text-anchor="middle">1MB 位图</text>
    <rect x="420" y="0" width="110" height="56" rx="8" class="box"/>
    <text class="th" x="475" y="20" text-anchor="middle">写盘线程</text>
    <text class="ts" x="475" y="38" text-anchor="middle">seek+write</text>
    <rect x="560" y="0" width="80" height="56" rx="8" class="box"/>
    <text class="th" x="600" y="20" text-anchor="middle">完成</text>
    <text class="ts" x="600" y="38" text-anchor="middle">合并/重命名</text>
    <path d="M110 28 H140" class="line"/>
    <path d="M250 28 H280" class="line"/>
    <path d="M390 28 H420" class="line"/>
    <path d="M530 28 H560" class="line"/>
  </g>
  <text class="ts" x="50" y="805">后台行为：最多 3 个槽并行；第 1 任务满速 24 线程，后续按 80% 链式递减；第 4 个起排队；完成后自动递补</text>
  <text class="ts" x="50" y="823">插队任务默认满速，槽位满时暂停最新唤醒任务；BT/磁力 120 秒无进展自动刷新 tracker 重试；限速/429 令牌桶退避；aria2c 备用通道一键切换</text>

  <!-- 场景：错误处理 -->
  <rect x="30" y="860" width="620" height="110" rx="12" class="stage"/>
  <text class="th" x="40" y="885">场景 6：错误 / 重试（v3.1.2 起 BT 自动刷新 tracker）</text>
  <g transform="translate(50, 900)">
    <rect x="0" y="0" width="120" height="44" rx="8" class="boxr"/>
    <text class="th" x="60" y="25" text-anchor="middle">任务失败/卡住</text>
    <rect x="160" y="0" width="120" height="44" rx="8" class="boxr"/>
    <text class="th" x="220" y="25" text-anchor="middle">自动处理</text>
    <text class="ts" x="220" y="40" text-anchor="middle">BT 刷新 tracker</text>
    <rect x="320" y="0" width="120" height="44" rx="8" class="boxr"/>
    <text class="th" x="380" y="25" text-anchor="middle">手动重试</text>
    <text class="ts" x="380" y="40" text-anchor="middle">右键 aria2c</text>
    <rect x="480" y="0" width="120" height="44" rx="8" class="boxr"/>
    <text class="th" x="540" y="25" text-anchor="middle">恢复下载</text>
    <path d="M120 22 H160" class="line"/>
    <path d="M280 22 H320" class="line"/>
    <path d="M440 22 H480" class="line"/>
  </g>
  <text class="ts" x="50" y="955">后台行为：BT/磁力 metadata 预转失败或 120 秒无进展 → 自动重拉 tracker 并重试一次；HTTP 失败仍支持右键 aria2c / N_m3u8DL-RE 手动重试</text>

  <!-- 场景：卸载 -->
  <rect x="30" y="990" width="620" height="140" rx="12" class="stage"/>
  <text class="th" x="40" y="1015">场景 7：卸载 / 重装</text>
  <g transform="translate(50, 1030)">
    <rect x="0" y="0" width="120" height="56" rx="8" class="boxr"/>
    <text class="th" x="60" y="20" text-anchor="middle">双击 卸载.exe</text>
    <text class="ts" x="60" y="38" text-anchor="middle">或控制面板</text>
    <rect x="160" y="0" width="120" height="56" rx="8" class="boxr"/>
    <text class="th" x="220" y="20" text-anchor="middle">选择操作</text>
    <text class="ts" x="220" y="38" text-anchor="middle">卸载 / 重装</text>
    <rect x="320" y="0" width="120" height="56" rx="8" class="boxr"/>
    <text class="th" x="380" y="20" text-anchor="middle">清注册表</text>
    <text class="ts" x="380" y="38" text-anchor="middle">Run/协议/卸载项</text>
    <rect x="480" y="0" width="120" height="56" rx="8" class="boxr"/>
    <text class="th" x="540" y="20" text-anchor="middle">删除目录</text>
    <text class="ts" x="540" y="38" text-anchor="middle">helper 异步删</text>
    <path d="M120 28 H160" class="line"/>
    <path d="M280 28 H320" class="line"/>
    <path d="M440 28 H480" class="line"/>
  </g>
  <text class="ts" x="50" y="1105">后台行为：控制面板直接卸载；用户双击可选手动重装 → 复制自身到 TEMP → 父进程退出 → 副本删目录并重新运行安装包</text>

  <!-- 底部提示 -->
  <text class="ts" x="340" y="1160" text-anchor="middle" fill="#5f5e5a">所有注册表操作均限定在 HKCU，无需管理员权限；用户数据（%APPDATA%\小助下载器）卸载时保留。</text>
</svg>
